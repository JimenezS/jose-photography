<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
    <!-- Transparent or Dark Background (remove rect if you want it transparent) -->
    <rect width="400" height="420" fill="transparent"/>
    
    <!-- === APERTURE ICON SECTION === -->
    <g transform="translate(100, 10)">
        <!-- Soft Pastel Green Blade Highlight Sector -->
        <path d="M 100 16 A 100 100 0 0 1 184 68 L 160 84 A 75 75 0 0 0 100 41 Z" fill="#d4e0d4" fill-opacity="0.5"/>

        <!-- Outer Precision Ring -->
        <circle cx="100" cy="100" r="100" stroke="#fdfdfd" stroke-width="2" fill="none" opacity="0.85"/>

        <!-- Curved Aperture Iris Blades -->
        <g stroke="#fdfdfd" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
            <path d="M 100 16 C 134 31 171 56 184 94" />
            <path d="M 184 94 C 190 131 171 168 139 193" />
            <path d="M 139 193 C 103 212 60 206 25 178" />
            <path d="M 25 178 C 3 149 3 100 25 63" />
            <path d="M 25 63 C 48 26 80 14 100 16" />
        </g>

        <!-- Inner Core Ring -->
        <circle cx="100" cy="100" r="70" stroke="#fdfdfd" stroke-width="1.2" stroke-dasharray="3 6" fill="none" opacity="0.4"/>

        <!-- Monogram JJ -->
        <text x="100" y="122" 
              font-family="'Josefin Sans', 'Helvetica Neue', sans-serif" 
              font-weight="300" 
              font-size="95" 
              fill="#fdfdfd" 
              text-anchor="middle" 
              letter-spacing="4">JJ</text>
    </g>

    <!-- === TYPOGRAPHY SECTION === -->
    <!-- Name -->
    <text x="200" y="270" 
          font-family="'Josefin Sans', 'Helvetica Neue', sans-serif" 
          font-weight="300" 
          font-size="28" 
          fill="#fdfdfd" 
          text-anchor="middle" 
          letter-spacing="8">JOSE JIMENEZ</text>

    <!-- Subtitle with Decorative Lines -->
    <g transform="translate(200, 310)">
        <!-- Left Line -->
        <line x1="-130" y1="0" x2="-45" y2="0" stroke="#d4e0d4" stroke-width="1.5" opacity="0.6"/>
        <!-- Photography Text -->
        <text x="0" y="6" 
              font-family="'Lato', sans-serif" 
              font-weight="300" 
              font-size="14" 
              fill="#d4e0d4" 
              text-anchor="middle" 
              letter-spacing="10">PHOTOGRAPHY</text>
        <!-- Right Line -->
        <line x1="45" y1="0" x2="130" y2="0" stroke="#d4e0d4" stroke-width="1.5" opacity="0.6"/>
    </g>
</svg>
